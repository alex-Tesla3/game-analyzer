# Local PostgreSQL + app (pilot stack)
# Usage:
#   cp .env.example .env   # set SECRET_KEY, etc.
#   docker compose -f docker-compose.postgres.yml up -d --build
#   docker compose -f docker-compose.postgres.yml exec game-analyzer \
#     python scripts/migrate_sqlite_to_postgres.py   # optional, if you have existing SQLite data

services:
  postgres:
    image: postgres:16-alpine
    container_name: game-analyzer-postgres
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-analyzer:
    build: .
    container_name: game-analyzer-pg-app
    ports:
      - "8080:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://game:game@postgres:5432/game_analyzer
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-changeme-admin}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret}
      - ALLOW_DEMO_ACCOUNTS=${ALLOW_DEMO_ACCOUNTS:-true}
      - PAYMENT_TEST_MODE=${PAYMENT_TEST_MODE:-true}
      - APP_PUBLIC_URL=http://127.0.0.1:8080
    volumes:
      - ./mock_data:/app/mock_data
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
