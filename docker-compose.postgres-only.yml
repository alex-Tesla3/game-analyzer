# Postgres only — run the app on the host (recommended when Docker app build fails).
#
#   docker compose -f docker-compose.postgres-only.yml up -d
#   export DATABASE_URL=postgresql://game:game@127.0.0.1:5432/game_analyzer
#   ./scripts/dev.sh

services:
  postgres:
    image: postgres:16-alpine
    container_name: game-analyzer-postgres
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
      POSTGRES_DB: game_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
