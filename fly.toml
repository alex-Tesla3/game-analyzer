# fly.toml — https://fly.io/docs/reference/configuration/
app = "game-analyzer-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_VERSION = "1.0.0"
  ALLOW_DEMO_ACCOUNTS = "true"
  PAYMENT_TEST_MODE = "true"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "game_analyzer_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
