name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          APP_ENV: development
          ALLOW_DEMO_ACCOUNTS: "true"
          GA_E2E_DISABLE_RATE_LIMIT: "1"
          PYTHONPATH: src:.
        run: ./scripts/run_tests.sh -q

  browser-e2e:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run browser E2E
        env:
          APP_ENV: development
          ALLOW_DEMO_ACCOUNTS: "true"
          GA_E2E_DISABLE_RATE_LIMIT: "1"
          GA_E2E_DISABLE_LLM: "1"
          PYTHONPATH: src:.
        run: python -m pytest tests/e2e -m browser -q
