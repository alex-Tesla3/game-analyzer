# Keep the Render free instance awake so Google Search Console / users
# never hit a cold-start timeout (free tier spins down after ~15 min idle).
name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app health endpoint
        run: curl -fsS --max-time 30 https://game-analyzer-eq8i.onrender.com/api/health || true
