# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect GitHub repo → New Blueprint → select render.yaml
services:
  - type: web
    name: game-analyzer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    disk:
      name: game-analyzer-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOW_DEMO_ACCOUNTS
        value: "true"
      - key: PAYMENT_TEST_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: APP_PUBLIC_URL
        value: https://game-analyzer-eq8i.onrender.com
      - key: PUBLIC_DEMO_BASE_URL
        value: https://game-analyzer-eq8i.onrender.com
      - key: WAFFO_PANCAKE_MERCHANT_ID
        value: MER_2E02n0IyVwWWOYFUlJNBKr
      - key: WAFFO_PANCAKE_STORE_ID
        value: STO_1QlHBCNATsR3yk9YNLOzZN
      - key: WAFFO_PANCAKE_ENV
        value: test
      - key: WAFFO_PANCAKE_PRODUCT_IDS
        value: '{"pro": "PROD_5q1A4DdiYRUW8ywtRqcKfE"}'
      - key: WAFFO_PANCAKE_CURRENCY
        value: CNY
      - key: GOOGLE_ANALYTICS_ID
        value: G-70XNK1WHPX
      - key: AUTO_PROCESS_AFTER_CRAWL
        value: "true"
      # 私钥属于敏感凭据:不同步进仓库;部署后请在 Render Dashboard 手动粘贴
      - key: WAFFO_PANCAKE_PRIVATE_KEY
        sync: false
