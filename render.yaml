# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect GitHub repo → New Blueprint → select render.yaml
services:
  - type: web
    name: game-analyzer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOW_DEMO_ACCOUNTS
        value: "true"
      - key: PAYMENT_TEST_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
