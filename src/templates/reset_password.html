<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 - Game Analyzer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; width: 100%; max-width: 420px; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { color: #94a3b8; font-size: 0.9rem; }
    label { display: block; margin: 16px 0 6px; font-size: 0.85rem; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    button { margin-top: 18px; width: 100%; padding: 12px; border: none; border-radius: 8px; background: #06b6d4; color: #fff; font-weight: 600; cursor: pointer; }
    .msg { margin-top: 12px; font-size: 0.9rem; }
    .err { color: #f87171; }
    .ok { color: #34d399; }
    a { color: #67e8f9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>重置密码</h1>
    <p>请输入新密码（至少 6 位）。</p>
    <form id="reset-form">
      <label for="password">新密码</label>
      <input id="password" type="password" minlength="6" required>
      <label for="password2">确认密码</label>
      <input id="password2" type="password" minlength="6" required>
      <button type="submit">保存新密码</button>
    </form>
    <p class="msg" id="msg"></p>
    <p style="margin-top:16px;"><a href="/login">返回登录</a></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const msgEl = document.getElementById('msg');
    if (!token) {
      msgEl.textContent = '缺少重置令牌，请从邮件/找回密码链接进入。';
      msgEl.className = 'msg err';
      document.getElementById('reset-form').style.display = 'none';
    }
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;
      if (p1 !== p2) {
        msgEl.textContent = '两次输入的密码不一致';
        msgEl.className = 'msg err';
        return;
      }
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: p1 }),
      });
      const data = await res.json();
      msgEl.textContent = data.message || (data.success ? '密码已更新' : '重置失败');
      msgEl.className = 'msg ' + (data.success ? 'ok' : 'err');
      if (data.success) {
        setTimeout(() => { window.location.href = '/login'; }, 1500);
      }
    });
  </script>
</body>
</html>
