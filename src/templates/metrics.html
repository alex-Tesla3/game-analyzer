<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指标详情 - 游戏数据分析引擎</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --apple-blue: #0071e3;
            --apple-gray: #86868b;
            --apple-gray-2: #6e6e73;
            --apple-gray-3: #1d1d1f;
            --apple-bg: #f5f5f7;
            --apple-surface: #ffffff;
            --apple-card: #ffffff;
            --apple-text: #1d1d1f;
            --apple-text-secondary: #86868b;
            --apple-border: rgba(0, 0, 0, 0.1);
            --apple-success: #34c759;
            --apple-warning: #ff9500;
            --apple-error: #ff3b30;
            --apple-radius-sm: 12px;
            --apple-radius-md: 18px;
            --apple-radius-lg: 24px;
            --apple-shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.08);
            --apple-blur: blur(20px);
        }
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--apple-bg);
            min-height: 100vh;
            color: var(--apple-text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: var(--apple-blur);
            -webkit-backdrop-filter: var(--apple-blur);
            border-bottom: 1px solid var(--apple-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 48px;
            z-index: 1000;
        }
        .sidebar-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }
        .sidebar-logo {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background: var(--apple-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
        }
        .sidebar-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: var(--apple-radius-sm);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--apple-gray-2);
            font-size: 0.875rem;
            font-weight: 400;
        }
        .nav-item:hover { color: var(--apple-text); }
        .nav-item.active { color: var(--apple-blue); font-weight: 500; }
        .nav-icon { font-size: 1rem; }
        .sidebar-right { display: flex; align-items: center; gap: 12px; }
        .user-menu { position: relative; }
        .user-menu-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: var(--apple-card);
            border-radius: var(--apple-radius-md);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 8px;
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--apple-border);
        }
        .user-menu:hover .user-menu-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-item {
            display: block;
            width: 100%;
            padding: 10px 16px;
            text-align: left;
            background: none;
            border: none;
            border-radius: var(--apple-radius-sm);
            font-size: 0.875rem;
            color: var(--apple-text);
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .dropdown-item:hover { background: var(--apple-bg); }
        .dropdown-item.danger { color: var(--apple-error); }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 980px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            font-family: inherit;
        }
        .btn-primary { background: var(--apple-blue); color: white; }
        .btn-primary:hover { background: #0077ED; }
        .btn-secondary { background: transparent; color: var(--apple-blue); }
        .btn-secondary:hover { text-decoration: underline; }
        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            justify-content: center;
            background: rgba(0, 0, 0, 0.06);
            color: var(--apple-gray-2);
            border-radius: 50%;
        }
        .btn-icon:hover { background: var(--apple-gray); color: white; }
        .container { max-width: 1400px; margin: 0 auto; padding: 80px 48px; }
        .header { margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid var(--apple-border); }
        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--apple-text);
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }
        .header-subtitle { font-size: 1.125rem; color: var(--apple-gray); }
        .filter-bar {
            background: var(--apple-card);
            border-radius: var(--apple-radius-lg);
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid var(--apple-border);
        }
        .filter-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; }
        .filter-group { flex: 1; min-width: 200px; }
        .filter-label {
            display: block;
            color: var(--apple-gray);
            font-size: 0.75rem;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .filter-select {
            width: 100%;
            background: var(--apple-bg);
            border: 1px solid var(--apple-border);
            border-radius: var(--apple-radius-sm);
            padding: 12px 16px;
            color: var(--apple-text);
            font-size: 0.9375rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-select:focus {
            outline: none;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background: var(--apple-card);
            border-radius: var(--apple-radius-lg);
            padding: 28px;
            border: 1px solid var(--apple-border);
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
        }
        .kpi-card.health-green::before { background: var(--apple-success); }
        .kpi-card.health-yellow::before { background: var(--apple-warning); }
        .kpi-card.health-red::before { background: var(--apple-error); }
        .kpi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .kpi-title { font-size: 0.875rem; color: var(--apple-gray); font-weight: 600; letter-spacing: 0.04em; }
        .kpi-value { font-size: 2.5rem; font-weight: 700; color: var(--apple-text); letter-spacing: -0.03em; margin-bottom: 10px; }
        .kpi-change {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.9375rem; font-weight: 600;
            padding: 6px 14px; border-radius: 980px;
        }
        .kpi-change.up { background: rgba(52, 199, 89, 0.12); color: var(--apple-success); }
        .kpi-change.down { background: rgba(255, 59, 48, 0.12); color: var(--apple-error); }
        .main-content { display: grid; grid-template-columns: 1fr; gap: 24px; }
        .section {
            background: var(--apple-card);
            border-radius: var(--apple-radius-lg);
            padding: 28px;
            border: 1px solid var(--apple-border);
        }
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--apple-text);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-container {
            height: 400px;
            position: relative;
            margin-top: 16px;
        }
        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        .metrics-table th, .metrics-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--apple-border);
        }
        .metrics-table th {
            font-size: 0.8125rem;
            color: var(--apple-gray);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .metrics-table td {
            font-size: 0.9375rem;
            color: var(--apple-text);
        }
        .metrics-table tr:hover td { background: var(--apple-bg); }
        .metric-name { font-weight: 500; }
        .metric-value { font-weight: 600; }
        .metric-trend.up { color: var(--apple-success); }
        .metric-trend.down { color: var(--apple-error); }
        .account-badge {
            display: inline-flex;
            align-items: center;
            max-width: 220px;
            padding: 6px 12px;
            margin-right: 8px;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--apple-gray);
            background: rgba(0, 0, 0, 0.05);
            border-radius: 980px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 1024px) {
            .sidebar { padding: 0 20px; }
            .container { padding: 80px 20px; }
            .filter-row { flex-direction: column; align-items: stretch; }
        }
    </style>
    <link rel="stylesheet" href="/static/css/app-nav.css">
    <script src="/static/js/app-nav.js" defer></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-left">
            <div class="sidebar-logo">🎮</div>
            <div class="sidebar-nav" id="app-nav-mount" data-active="metrics"></div>
        </div>
        <div class="sidebar-right">
            <span class="account-badge" data-account-badge>…</span>
            <button class="btn btn-icon" id="config-toggle" title="配置管理">⚙️</button>
            <button class="btn btn-primary" onclick="performAIAnalysis()">🤖 AI 分析</button>
            <div class="user-menu">
                <button class="btn btn-icon">👤</button>
                <div class="user-menu-dropdown">
                    <button class="dropdown-item" onclick="window.location.href='/pricing'">💎 订阅套餐</button>
                    <button class="dropdown-item danger" onclick="logout()">🚪 退出登录</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1 class="header-title">📈 指标详情</h1>
            <p class="header-subtitle">深入分析各项核心指标，追踪业务增长趋势</p>
        </div>

        <div class="filter-bar">
            <div class="filter-row">
                <div class="filter-group">
                    <label class="filter-label">产品选择</label>
                    <select id="product-select" class="filter-select" onchange="loadMetrics()">
                        <option value="all">全部产品</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">时间周期</label>
                    <select id="period-select" class="filter-select" onchange="loadMetrics()">
                        <option value="all">全部周期</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">指标类型</label>
                    <select id="metric-type-select" class="filter-select" onchange="loadMetrics()">
                        <option value="all">全部指标</option>
                        <option value="downloads">下载相关</option>
                        <option value="revenue">收入相关</option>
                        <option value="retention">留存相关</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="loadMetrics()">🔍 应用筛选</button>
            </div>
            <p id="filter-hint" style="margin-top:10px;font-size:0.875rem;color:var(--apple-gray);"></p>
        </div>

        <div class="kpi-grid" id="kpi-grid"></div>

        <div class="main-content">
            <div class="section">
                <h2 class="section-title">📊 指标趋势图</h2>
                <div class="chart-container">
                    <canvas id="metricsChart"></canvas>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">📋 详细指标列表</h2>
                <table class="metrics-table">
                    <thead>
                        <tr>
                            <th>指标名称</th>
                            <th>当前值</th>
                            <th>单位</th>
                            <th>环比变化</th>
                            <th>同比变化</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="metrics-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/auth-token.js"></script>
    <script src="/static/js/chart.js"></script>
    <script src="/static/js/account-display.js" defer></script>
    <script>
        let metricsData = [];

        function metricName(row) {
            return row.metric || row['metric'] || row['指标'] || '';
        }

        function getToken() {
            return typeof getAuthToken === 'function' ? getAuthToken() : localStorage.getItem('access_token');
        }

        function ensureLoggedIn() {
            if (!getToken()) {
                window.location.href = '/login?redirect=' + encodeURIComponent('/metrics');
                return false;
            }
            return true;
        }

        function populateProductSelect(catalog, preserveValue) {
            const select = document.getElementById('product-select');
            if (!select || !catalog?.products?.length) return;
            const current = preserveValue !== undefined ? preserveValue : select.value;
            select.innerHTML = '<option value="all">全部产品</option>';
            catalog.products.forEach((item) => {
                const label = item.name || item.id;
                select.innerHTML += `<option value="${item.id}">${label}</option>`;
            });
            const has = Array.from(select.options).some((o) => o.value === current);
            select.value = has ? current : 'all';
        }

        function populatePeriodSelect(catalog, preserveValue) {
            const select = document.getElementById('period-select');
            if (!select || !catalog?.time_periods?.length) return;
            const current = preserveValue !== undefined ? preserveValue : select.value;
            select.innerHTML = '<option value="all">全部周期</option>';
            catalog.time_periods.forEach((item) => {
                select.innerHTML += `<option value="${item.id}">${item.name}</option>`;
            });
            const has = Array.from(select.options).some((o) => o.value === current);
            select.value = has ? current : 'all';
        }

        async function initFilters() {
            if (!ensureLoggedIn()) return false;
            const token = getToken();
            const response = await fetch(`/api/options?token=${encodeURIComponent(token)}`);
            if (!response.ok) return false;
            const result = await response.json();
            if (result.success) {
                populateProductSelect({ products: result.products });
                populatePeriodSelect({ time_periods: result.time_periods });
            }
            return true;
        }

        async function loadMetrics() {
            if (!ensureLoggedIn()) return;
            const token = getToken();
            const product = document.getElementById('product-select').value;
            const period = document.getElementById('period-select').value;
            const metricType = document.getElementById('metric-type-select').value;
            
            let url = `/api/metrics?token=${encodeURIComponent(token)}`;
            if (product !== 'all') url += `&product=${encodeURIComponent(product)}`;
            if (period && period !== 'all') url += `&time_period=${encodeURIComponent(period)}`;
            
            const response = await fetch(url);
            if (response.status === 401) {
                window.location.href = '/login?redirect=' + encodeURIComponent('/metrics');
                return;
            }
            const result = await response.json();
            
            if (result.success) {
                let data = result.data || [];
                if (result.catalog) {
                    populateProductSelect(result.catalog, product);
                    populatePeriodSelect(result.catalog, period);
                }
                if (result.total > 0 && data.length === 0) {
                    console.warn('筛选后无指标，请切换产品或周期（当前数据源：' + (result.source || '') + '）');
                }
                const hint = document.getElementById('filter-hint');
                if (hint) {
                    hint.textContent = result.filtered_count != null
                        ? `显示 ${result.filtered_count} / ${result.total} 条（数据源：${result.source || '-'}）`
                        : '';
                }
                if (metricType !== 'all') {
                    const downloadMetrics = ['用户总下载量', 'downloads', 'installs', '总下载'];
                    const revenueMetrics = ['充值金额', 'revenue', '收入', '付费付费占比', 'ARPPU', 'arppu'];
                    const retentionMetrics = ['7日留存率', '留存率', 'retention', 'DAU/MAU', 'DAU', 'dau_mau'];
                    
                    data = data.filter(m => {
                        const name = metricName(m);
                        if (metricType === 'downloads') return downloadMetrics.some(k => name.includes(k));
                        if (metricType === 'revenue') return revenueMetrics.some(k => name.includes(k));
                        if (metricType === 'retention') return retentionMetrics.some(k => name.includes(k));
                        return true;
                    });
                }
                
                metricsData = data;
                renderKPI();
                renderTable();
                initChart();
            }
        }

        function renderKPI() {
            const grid = document.getElementById('kpi-grid');
            if (!metricsData.length) {
                grid.innerHTML = '<p style="grid-column:1/-1;padding:20px;color:#86868b;">暂无指标数据。请确认已登录，并将产品筛选设为「全部产品」。</p>';
                return;
            }

            const seen = new Set();
            const cards = [];
            for (const row of metricsData) {
                const key = metricName(row);
                if (!key || seen.has(key)) continue;
                seen.add(key);
                const rawValue = row['值'] ?? row.value ?? '-';
                const changeStr = row['环比变化'] || row['同比置比'] || '';
                let change = 0;
                const match = String(changeStr).match(/([+-]?\d+(?:\.\d+)?)/);
                if (match) change = parseFloat(match[1]);
                cards.push({ key, rawValue, change });
                if (cards.length >= 6) break;
            }

            grid.innerHTML = cards.map((card, index) => {
                const health = card.change >= 0 ? 'health-green' : card.change >= -5 ? 'health-yellow' : 'health-red';
                const icons = ['📥', '💰', '👥', '📊', '💸', '⏱️'];
                return `
                    <div class="kpi-card ${health}">
                        <div class="kpi-header">
                            <span class="kpi-title">${card.key}</span>
                            <span style="font-size:1.5rem;">${icons[index % icons.length]}</span>
                        </div>
                        <div class="kpi-value">${card.rawValue}</div>
                        <div class="kpi-change ${card.change >= 0 ? 'up' : 'down'}">
                            ${card.change ? `${card.change >= 0 ? '↑' : '↓'} ${Math.abs(card.change).toFixed(1)}` : '—'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderTable() {
            const body = document.getElementById('metrics-table-body');
            
            // 定义产品颜色
            const productColors = {
                'game_a': '#0071e3',
                'game_b': '#34c759', 
                'game_c': '#ff9500'
            };
            
            const productNames = {};
            metricsData.forEach((m) => {
                const pid = m.product || 'unknown';
                productNames[pid] = m.product_name || productNames[pid] || pid;
            });
            
            const groupedByProduct = {};
            metricsData.forEach(m => {
                const product = m.product || 'unknown';
                if (!groupedByProduct[product]) {
                    groupedByProduct[product] = [];
                }
                groupedByProduct[product].push(m);
            });
            
            let html = '';
            
            Object.keys(groupedByProduct).forEach(product => {
                const color = productColors[product] || '#8b5cf6';
                const name = productNames[product] || product;
                
                // 添加产品分组标题
                html += `
                    <tr style="background: ${color}20;">
                        <td colspan="6" style="padding: 16px;">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <div style="width: 12px; height: 12px; border-radius: 50%; background: ${color};"></div>
                                <span style="font-weight: 600; color: ${color}; font-size: 1rem;">${name}</span>
                            </div>
                        </td>
                    </tr>
                `;
                
                // 获取该产品的所有指标（去重）
                const metrics = groupedByProduct[product];
                const uniqueMetrics = {};
                
                metrics.forEach(m => {
                    const mkey = metricName(m);
                    if (mkey && !uniqueMetrics[mkey]) {
                        uniqueMetrics[mkey] = m;
                    }
                });
                
                // 渲染指标行
                Object.values(uniqueMetrics).forEach(m => {
                    const mlabel = metricName(m) || '-';
                    const value = m['值'] || m.value || '-';
                    const changeStr = m['环比变化'] || m['同比置比'] || '0%';
                    const match = changeStr.match(/([+-]?\d+)%/);
                    const change = match ? parseFloat(match[1]) : 0;
                    const trendClass = change >= 0 ? 'up' : 'down';
                    const trendIcon = change >= 0 ? '↑' : '↓';
                    
                    html += `
                        <tr style="border-left: 3px solid ${color};">
                            <td class="metric-name">${mlabel}</td>
                            <td class="metric-value">${value}</td>
                            <td>-</td>
                            <td class="metric-trend ${trendClass}" style="color: ${change >= 0 ? '#34c759' : '#ff3b30'};">
                                ${trendIcon} ${Math.abs(change).toFixed(1)}%
                            </td>
                            <td class="metric-trend ${trendClass}">
                                -
                            </td>
                            <td>
                                <span style="padding:4px 12px;border-radius:980px;font-size:0.75rem;font-weight:500;${getHealthStyle(change)}">
                                    ${getHealthText(change)}
                                </span>
                            </td>
                        </tr>
                    `;
                });
            });
            
            body.innerHTML = html;
        }

        function initChart() {
            const ctx = document.getElementById('metricsChart').getContext('2d');
            const labels = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            const downloads = [12500, 14200, 11800, 13500, 16200, 18900, 17500];
            const revenue = [45000, 52000, 41000, 48000, 58000, 65000, 61000];
            const activeUsers = [8500, 9200, 7800, 8800, 10500, 12000, 11200];

            if (window.metricsChartInstance) {
                window.metricsChartInstance.destroy();
            }

            window.metricsChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: '下载量', data: downloads, borderColor: '#0071e3', tension: 0.4, fill: false },
                        { label: '收入', data: revenue, borderColor: '#34c759', tension: 0.4, fill: false },
                        { label: '活跃用户', data: activeUsers, borderColor: '#ff9500', tension: 0.4, fill: false }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true, position: 'top' } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function formatNumber(num) {
            if (num >= 10000) {
                return (num / 10000).toFixed(1) + '万';
            }
            return num.toLocaleString();
        }

        function getHealthStyle(change) {
            if (change >= 0) return 'background:rgba(52,199,89,0.1);color:#34c759;';
            if (change >= -5) return 'background:rgba(255,149,0,0.1);color:#ff9500;';
            return 'background:rgba(255,59,48,0.1);color:#ff3b30;';
        }

        function getHealthText(change) {
            if (change >= 0) return '良好';
            if (change >= -5) return '一般';
            return '警告';
        }

        function logout() {
            if (typeof clearAuthToken === 'function') clearAuthToken();
            else localStorage.removeItem('access_token');
            window.location.href = '/login';
        }

        function performAIAnalysis() {
            window.open('/#ai-analysis', '_self');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.AppNav) AppNav.mount('#app-nav-mount');
            await initFilters();
            await loadMetrics();
        });
    </script>
</body>
</html>
