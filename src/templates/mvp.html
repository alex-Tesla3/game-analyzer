
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Analyzer MVP</title>
  <link rel="stylesheet" href="/static/css/analysis-guide.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1d2433;
      --muted: #657083;
      --line: #dfe4ea;
      --accent: #136f63;
      --accent-2: #b54708;
      --ok: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    .wrap {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
    }
    .topbar {
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button, a.button {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      min-height: 38px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    main { padding: 24px 0 36px; }
    .status {
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric, .panel, .game {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric { padding: 16px; min-height: 92px; }
    .label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .value {
      font-size: 28px;
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 16px;
      align-items: start;
    }
    .strategy-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .strategy-item {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      min-height: 112px;
    }
    .strategy-item h3 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .panel { padding: 18px; }
    .panel h2, .game h2 {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .games {
      display: grid;
      gap: 12px;
    }
    .game { padding: 18px; }
    .game-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 0 9px;
      background: #e9f7f4;
      color: var(--ok);
      font-size: 13px;
      white-space: nowrap;
    }
    .badge.warn {
      background: #fff4e6;
      color: var(--accent-2);
    }
    .split {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .mini {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 70px;
    }
    .mini strong { display: block; font-size: 18px; margin-top: 4px; }
    ul { margin: 8px 0 0; padding-left: 18px; }
    li { margin: 7px 0; color: #2c3442; }
    .checks {
      display: grid;
      gap: 8px;
    }
    .check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      padding: 9px 0;
      font-size: 14px;
    }
    .check:last-child { border-bottom: 0; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--ok);
      margin-top: 4px;
      flex: 0 0 auto;
    }
    code {
      background: #eef1f5;
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 13px;
    }
    .empty {
      padding: 24px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
    }
    .filter-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 200px 120px auto;
      gap: 14px 16px;
      align-items: end;
    }
    .filter-panel label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .filter-panel select,
    .filter-panel input[type="number"] {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
    }
    #product-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fafbfc;
    }
    .product-picker-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .product-picker-item:hover { background: #eef1f5; }
    .product-picker-name { flex: 1; }
    .product-picker-genre {
      font-size: 11px;
      color: var(--muted);
      background: #eef1f5;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .product-picker-empty { font-size: 13px; color: var(--muted); margin: 0; }
    .filter-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-hint {
      grid-column: 1 / -1;
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }
    #product-select { display: none; }
    @media (max-width: 860px) {
      .filter-panel { grid-template-columns: 1fr; }
      .topbar, .game-head { align-items: stretch; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .metrics, .grid, .split, .strategy-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <div>
        <h1>Game Analyzer MVP</h1>
        <p class="subtitle">Steam 真实评论抓取、确定性分析、源数据一致性验证</p>
      </div>
      <div class="actions">
        <button class="button" type="button" data-sitemap-open title="帮助与指引">📖 指引</button>
        <a class="button" href="/dashboard">← 数据看板</a>
        <a class="button" href="/api/mvp/latest" target="_blank">查看 JSON</a>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="filter-panel" aria-label="筛选条件">
      <div style="grid-column: 1 / -1;">
        <label>产品选择（可多选；TapTap 填 AppID，Google Play 填包名）</label>
        <div id="product-picker"></div>
        <select id="product-select" multiple></select>
      </div>
      <div>
        <label for="channel-select">渠道 / 数据来源</label>
        <select id="channel-select">
          <option value="steam">Steam</option>
        </select>
      </div>
      <div>
        <label for="max-reviews">每款评论数</label>
        <input id="max-reviews" type="number" min="5" max="100" value="20">
      </div>
      <div style="grid-column: 1 / -1;">
        <label for="product-names">自定义产品名（可选）</label>
        <input id="product-names" type="text" placeholder="产品ID:显示名，如 com.fun.lastwar.gp:Last War生存, 33569155:Last War" style="width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;">
      </div>
      <div class="filter-actions">
        <button id="apply-filter" type="button">应用筛选</button>
        <button id="refresh" class="primary" type="button">重新抓取</button>
      </div>
      <p id="filter-hint" class="filter-hint">加载产品列表…</p>
    </section>
    <div id="status" class="status">正在读取最新 MVP 结果...</div>
    <section id="content"></section>
  </main>
  <script src="/static/js/data-flow-guide.js"></script>
  <script src="/static/js/analysis-guide.js"></script>
  <script src="/static/js/site-map-panel.js" defer></script>
  <script src="/static/js/product-picker.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const refreshButton = document.getElementById('refresh');
    const filterHintEl = document.getElementById('filter-hint');
    const channelSelect = document.getElementById('channel-select');
    let lastPayload = null;
    let catalogProducts = [];
    let defaultByChannel = {};

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function selectedProductIds() {
      if (window.ProductPicker) {
        return ProductPicker.getSelectedIds();
      }
      const sel = document.getElementById('product-select');
      if (!sel) return [];
      return Array.from(sel.selectedOptions).map((o) => o.value).filter(Boolean);
    }

    function selectedChannel() {
      return (channelSelect && channelSelect.value) || 'steam';
    }

    function filterPayload(payload) {
      const ids = new Set(selectedProductIds());
      if (!ids.size) return payload;
      const analysis = payload.analysis || {};
      const reports = (analysis.product_reports || []).filter((r) =>
        ids.has(String(r.product || ''))
      );
      const filteredAnalysis = Object.assign({}, analysis, {
        product_reports: reports,
        summary: Object.assign({}, analysis.summary || {}, {
          total_products: reports.length,
        }),
      });
      if (analysis.ai_strategy && analysis.ai_strategy.peer_comparison) {
        filteredAnalysis.ai_strategy = Object.assign({}, analysis.ai_strategy, {
          peer_comparison: (analysis.ai_strategy.peer_comparison || []).filter((p) =>
            ids.has(String(p.product || p.product_id || ''))
          ),
        });
      }
      return Object.assign({}, payload, { analysis: filteredAnalysis });
    }

    function render(payload) {
      lastPayload = payload;
      payload = filterPayload(payload);
      const analysis = payload.analysis || {};
      const validation = payload.validation || {};
      const summary = analysis.summary || {};
      const strategy = analysis.ai_strategy || {};
      const reports = analysis.product_reports || [];
      const checks = validation.checks || [];
      const ids = selectedProductIds();
      const ch = selectedChannel();
      statusEl.textContent =
        `最新结果：${summary.generated_at || validation.checked_at || '未知'} · 已选 ${ids.length} 款产品 · 渠道 ${ch}`;

      if (!reports.length) {
        contentEl.innerHTML = '<div class="empty">还没有可展示的 MVP 分析结果，请点击“重新抓取”。</div>';
        return;
      }

      const gameHtml = reports.map((report) => {
        const themes = (report.top_negative_themes || []).map((item) =>
          `<li>${escapeHtml(item.theme)}：${escapeHtml(item.count)}</li>`
        ).join('') || '<li>未在样本中识别到高频负面主题</li>';
        const negatives = (report.representative_negative_reviews || []).map((text) =>
          `<li>${escapeHtml(text)}</li>`
        ).join('') || '<li>暂无负面样本</li>';
        const riskClass = report.risk_level === 'low' ? '' : 'warn';
        return `
          <article class="game">
            <div class="game-head">
              <div>
                <h2>${escapeHtml(report.product_name)}</h2>
                <div class="label">产品 ID：${escapeHtml(report.product)} · ${escapeHtml(ch)}</div>
              </div>
              <span class="badge ${riskClass}">风险：${escapeHtml(report.risk_level)}</span>
            </div>
            <div class="split">
              <div class="mini"><span class="label">样本数</span><strong>${escapeHtml(report.sample_size)}</strong></div>
              <div class="mini"><span class="label">好评</span><strong>${escapeHtml(report.positive_reviews)}</strong></div>
              <div class="mini"><span class="label">差评</span><strong>${escapeHtml(report.negative_reviews)}</strong></div>
            </div>
            <p><strong>样本好评率：</strong>${escapeHtml(report.positive_rate)}%</p>
            <p><strong>建议：</strong>${escapeHtml(report.recommendation)}</p>
            <div class="split">
              <div>
                <div class="label">负面主题</div>
                <ul>${themes}</ul>
              </div>
              <div style="grid-column: span 2;">
                <div class="label">代表性负面评论</div>
                <ul>${negatives}</ul>
              </div>
            </div>
          </article>
        `;
      }).join('');

      const checkHtml = checks.map((check) => `
        <div class="check">
          <span class="dot"></span>
          <div>
            <strong>${escapeHtml(check.name)}</strong><br>
            <span class="label">${escapeHtml(check.detail)}</span>
          </div>
        </div>
      `).join('');

      const peerHtml = (strategy.peer_comparison || []).map((item) => `
        <div class="strategy-item">
          <h3>${escapeHtml(item.product_name)}</h3>
          <div class="label">${escapeHtml(item.relative_position)} · Steam 汇总好评率 ${escapeHtml(item.steam_total_positive_rate)}%</div>
          <p>${escapeHtml(item.what_to_learn)}</p>
          <div class="label">中位总游玩：${escapeHtml(item.median_playtime_hours)} 小时 · 汇总评论：${escapeHtml(item.steam_total_reviews)}</div>
        </div>
      `).join('');

      const needsHtml = (strategy.user_needs || []).slice(0, 6).map((item) => `
        <div class="strategy-item">
          <h3>${escapeHtml(item.need)}</h3>
          <div class="label">评论信号：${escapeHtml(item.signal_count)}</div>
          <p>${escapeHtml(item.product_action)}</p>
          <ul>${(item.evidence || []).slice(0, 2).map((text) => `<li>${escapeHtml(text)}</li>`).join('')}</ul>
        </div>
      `).join('');

      const actionHtml = (strategy.prioritized_actions || []).map((item) => `
        <div class="strategy-item">
          <h3>${escapeHtml(item.priority)}. ${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.why)}</p>
          <p><strong>改进：</strong>${escapeHtml(item.action)}</p>
          <p><strong>验证：</strong>${escapeHtml(item.experiment)}</p>
        </div>
      `).join('');

      const segmentHtml = (strategy.target_user_segments || []).map((item) => `
        <li>${escapeHtml(item.segment)}：${escapeHtml(item.sample_count)} 条样本，核心需求：${escapeHtml(item.primary_need)}</li>
      `).join('');

      const strategyHtml = `
        <section class="panel" style="margin-bottom: 18px;">
          <h2>AI 产品改进分析</h2>
          <p>${escapeHtml(strategy.opportunity_summary || '正在等待真实数据生成产品策略。')}</p>
          <p class="label">模式：${escapeHtml(strategy.mode || 'local_ai_grounded_in_steam_data')}。分析基于真实 Steam 评论、评论汇总指标和同类产品对比生成。</p>
          <h2>同类产品结果对比</h2>
          <div class="strategy-grid">${peerHtml || '<div class="empty">暂无同类产品对比。</div>'}</div>
          <h2>面向用户的需求</h2>
          <div class="strategy-grid">${needsHtml || '<div class="empty">暂无可识别需求，请扩大评论样本。</div>'}</div>
          <h2>优先改进路线</h2>
          <div class="strategy-grid">${actionHtml || '<div class="empty">暂无建议。</div>'}</div>
          <h2>目标用户段</h2>
          <ul>${segmentHtml || '<li>暂无用户段数据。</li>'}</ul>
        </section>
      `;

      contentEl.innerHTML = `
        <section class="metrics">
          <div class="metric"><div class="label">产品数</div><div class="value">${escapeHtml(summary.total_products)}</div></div>
          <div class="metric"><div class="label">真实评论样本</div><div class="value">${escapeHtml(summary.total_comments)}</div></div>
          <div class="metric"><div class="label">整体好评率</div><div class="value">${escapeHtml(summary.overall_positive_rate)}%</div></div>
          <div class="metric"><div class="label">验证状态</div><div class="value">${validation.passed ? '通过' : '失败'}</div></div>
        </section>
        ${strategyHtml}
        <section class="grid">
          <div class="games">${gameHtml}</div>
          <aside class="panel">
            <h2>验证结果</h2>
            <div class="checks">${checkHtml}</div>
            <p class="label">验证会从源评论重算样本量、正负评论数和好评率，确认分析结果没有脱离爬取数据。</p>
          </aside>
        </section>
      `;
    }

    function productsForChannel(channel) {
      const ch = channel || selectedChannel();
      const scoped = catalogProducts.filter((p) => !p.platform || p.platform === ch);
      return scoped.length ? scoped : catalogProducts;
    }

    function channelHint(channel) {
      const sync = '抓取成功后数据自动写入看板数据集，请前往 /dashboard 点「应用筛选」查看。';
      const hints = {
        steam: '「重新抓取」从 Steam 拉取真实评论；本页「应用筛选」仅过滤当前报告。' + sync,
        taptap: 'TapTap 支持 Last War(33569155)、王者荣耀(23167) 等；可填 AppID 或游戏名。' + sync,
        google_play: 'Google Play 支持 Last War(com.fun.lastwar.gp)、Dark War(com.readygo.dark.gp) 等包名或游戏名。' + sync,
        app_store: 'App Store 暂不支持抓取，仅可筛选已有结果。',
      };
      return hints[channel] || hints.steam;
    }

    function renderProductPicker(channel) {
      const ch = channel || selectedChannel();
      const products = productsForChannel(ch);
      const defaults = defaultByChannel[ch] || dataDefaultIds(ch);
      if (window.ProductPicker) {
        ProductPicker.render('product-picker', products, {
          selectedIds: defaults.filter((id) => products.some((p) => p.id === id)),
          defaultCount: Math.min(3, products.length),
          onChange: () => {
            if (lastPayload) render(lastPayload);
          },
        });
      }
    }

    function dataDefaultIds(channel) {
      if (channel === 'taptap') return ['168332'];
      if (channel === 'google_play') return ['com.miHoYo.GenshinImpact'];
      return [];
    }

    async function loadCatalog() {
      const res = await fetch('/api/mvp/catalog');
      if (!res.ok) throw new Error('无法加载产品列表');
      const data = await res.json();
      catalogProducts = data.products || [];
      defaultByChannel = data.default_by_channel || {};
      channelSelect.innerHTML = (data.channels || [{ id: 'steam', label: 'Steam' }])
        .map((c) => {
          const label = c.label + (c.crawl_supported ? '' : '（仅展示）');
          return `<option value="${escapeHtml(c.id)}">${escapeHtml(label)}</option>`;
        })
        .join('');
      renderProductPicker(selectedChannel());
      filterHintEl.textContent = channelHint(selectedChannel());
    }

    async function loadLatest() {
      const response = await fetch('/api/mvp/latest');
      if (!response.ok) throw new Error(await response.text());
      render(await response.json());
    }

    async function refreshData() {
      const channel = selectedChannel();
      const crawlRoutes = {
        steam: '/api/mvp/steam',
        taptap: '/api/mvp/taptap',
        google_play: '/api/mvp/google-play',
      };
      const route = crawlRoutes[channel];
      if (!route) {
        statusEl.textContent = '当前渠道暂不支持重新抓取，请切换 Steam / TapTap / Google Play。';
        return;
      }
      const ids = selectedProductIds();
      if (!ids.length) {
        statusEl.textContent = '请至少选择一款产品';
        return;
      }
      const labels = { steam: 'Steam', taptap: 'TapTap', google_play: 'Google Play' };
      const maxReviews = Math.min(100, Math.max(5, parseInt(document.getElementById('max-reviews').value, 10) || 20));
      refreshButton.disabled = true;
      statusEl.textContent = `正在从 ${labels[channel] || channel} 抓取 ${ids.length} 款产品（每款最多 ${maxReviews} 条评论）…`;
      try {
        const params = new URLSearchParams();
        params.set('app_ids', ids.join(','));
        params.set('max_reviews', String(maxReviews));
        const customNames = (document.getElementById('product-names')?.value || '').trim();
        if (customNames) params.set('product_names', customNames);
        const response = await fetch(route + '?' + params.toString());
        if (!response.ok) throw new Error(await response.text());
        const payload = await response.json();
        const mode = payload.data_mode === 'live' ? '真实数据' : '演示回退';
        const dashParams = new URLSearchParams();
        dashParams.set('product_ids', ids.join(','));
        if (channel && channel !== 'steam') dashParams.set('data_source', channel);
        statusEl.innerHTML =
          `${labels[channel]} 抓取完成（${mode}）· 数据已写入看板数据集，` +
          `<a href="/dashboard?${dashParams.toString()}" style="color:var(--accent);margin-left:6px;">前往看板查看 →</a>`;
        await loadLatest();
      } catch (error) {
        statusEl.textContent = `刷新失败：${error.message}`;
      } finally {
        refreshButton.disabled = false;
      }
    }

    document.getElementById('apply-filter').addEventListener('click', () => {
      if (lastPayload) render(lastPayload);
      else loadLatest().catch((e) => { statusEl.textContent = e.message; });
    });
    channelSelect.addEventListener('change', () => {
      const ch = selectedChannel();
      filterHintEl.textContent = channelHint(ch);
      renderProductPicker(ch);
      if (lastPayload) render(lastPayload);
    });
    refreshButton.addEventListener('click', refreshData);

    (async function init() {
      try {
        await loadCatalog();
        await loadLatest();
      } catch (error) {
        statusEl.textContent = `读取失败：${error.message}`;
        contentEl.innerHTML = '<div class="empty">还没有结果。选择产品后点击「重新抓取」。</div>';
      }
    })();
  </script>
</body>
</html>
