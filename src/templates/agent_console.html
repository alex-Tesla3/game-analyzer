<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎧 人工客服控制台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'SF Pro Display', -apple-system, sans-serif; background: #1a1a2e; color: #fff; }
        
        .header { background: #16213e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; display: flex; align-items: center; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        
        .main-content { display: flex; height: calc(100vh - 60px); }
        
        .sidebar { width: 250px; background: #16213e; padding: 20px; border-right: 1px solid #2d3436; }
        .sidebar-item { padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .sidebar-item:hover, .sidebar-item.active { background: #007bff; }
        
        .content-area { flex: 1; padding: 20px; overflow-y: auto; min-height: 0; }
        .content-area.chat-mode {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: #16213e; padding: 20px; border-radius: 12px; }
        .stat-card .number { font-size: 32px; font-weight: bold; color: #00d9ff; }
        .stat-card .label { color: #888; margin-top: 5px; }
        
        .table-container { background: #16213e; border-radius: 12px; overflow: hidden; }
        .table-container table { width: 100%; border-collapse: collapse; }
        .table-container th, .table-container td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #2d3436; }
        .table-container th { background: #0f3460; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .badge.active { background: #28a745; }
        .badge.ended { background: #6c757d; }
        .badge.pending_human { background: #ffc107; color: #000; }
        
        #chats-section {
            display: none;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        #chats-section.active-panel { display: flex; flex-direction: column; }

        .chat-panel { display: flex; flex: 1; min-height: 0; height: 100%; }
        .chat-list { width: 300px; border-right: 1px solid #2d3436; overflow-y: auto; flex-shrink: 0; }
        .chat-item { padding: 15px; border-bottom: 1px solid #2d3436; cursor: pointer; transition: background 0.2s; }
        .chat-item:hover, .chat-item.active { background: #0f3460; }
        .chat-item .username { font-weight: 600; }
        .chat-item .time { color: #888; font-size: 12px; }
        .chat-item .preview {
            color: #9aa5b1;
            font-size: 12px;
            margin-top: 6px;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .live-indicator {
            font-size: 12px;
            color: #28a745;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 12px;
            font-weight: normal;
        }
        .live-indicator::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
            animation: live-pulse 2s ease-in-out infinite;
        }
        @keyframes live-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #1a1a2e;
        }
        .chat-header {
            flex-shrink: 0;
            padding: 14px 20px;
            background: #0f3460;
            border-bottom: 1px solid #2d3436;
        }
        .chat-messages {
            flex: 1;
            min-height: 0;
            padding: 20px 20px 12px;
            overflow-y: auto;
        }
        .chat-input-area {
            flex-shrink: 0;
            padding: 16px 20px 24px;
            background: #0f3460;
            border-top: 1px solid #2d3436;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.35);
        }
        .chat-input-area input {
            flex: 1;
            min-height: 44px;
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            background: #16213e;
            color: white;
            font-size: 15px;
        }
        .chat-message { margin-bottom: 15px; }
        /* 客服视角：客户在左，客服/AI 在右 */
        .chat-message.user { text-align: left; }
        .chat-message.agent { text-align: right; }
        .chat-message.system { text-align: center; }
        .chat-message .bubble { display: inline-block; padding: 10px 15px; border-radius: 15px; max-width: 70%; }
        .chat-message.user .bubble { background: #007bff; }
        .chat-message.agent .bubble { background: #28a745; }
        .chat-message.system .bubble { background: #6c757d; font-size: 12px; }
        .chat-message .sender { font-size: 12px; color: #888; margin-bottom: 5px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #16213e; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; }
        .modal-content h3 { margin-bottom: 20px; }
        .modal-content textarea { width: 100%; padding: 10px; border: 1px solid #2d3436; border-radius: 8px; background: #1a1a2e; color: white; min-height: 100px; margin-bottom: 15px; }
        .modal-content .btn { margin-right: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎧 人工客服控制台<span class="live-indicator" id="live-indicator">实时刷新</span></h1>
        <div class="user-info">
            <span id="current-user" class="account-badge" data-account-badge style="color:#ccc;background:rgba(255,255,255,0.08);max-width:none;">…</span>
            <button class="btn btn-danger" onclick="logout()">退出登录</button>
        </div>
    </div>
    
    <div class="main-content">
        <div class="sidebar">
            <div class="sidebar-item active" onclick="showDashboard()">📊 仪表盘</div>
            <div class="sidebar-item" onclick="showChats()">💬 对话管理</div>
            <div class="sidebar-item" onclick="showTickets()">🎫 工单管理</div>
            <div class="sidebar-item" onclick="window.location.href='/'">🏠 返回首页</div>
        </div>
        
        <div class="content-area">
            <!-- 仪表盘 -->
            <div id="dashboard-section">
                <h2>📊 实时统计</h2>
                <div class="stats-grid" id="stats-grid"></div>
                
                <h3 style="margin-top: 20px;">📋 等待处理的对话</h3>
                <div class="table-container" id="waiting-chats-table"></div>
            </div>
            
            <!-- 对话管理 -->
            <div id="chats-section">
                <div class="chat-panel">
                    <div class="chat-list" id="chat-list"></div>
                    <div class="chat-area" id="chat-area" style="display: none;">
                        <div class="chat-header">
                            <h3 id="chat-title">对话详情</h3>
                        </div>
                        <div class="chat-messages" id="chat-messages"></div>
                        <div class="chat-input-area">
                            <input type="text" id="agent-input" placeholder="输入回复，或点击麦克风语音输入..." onkeydown="if(event.key==='Enter'){event.preventDefault();sendAgentMessage();}">
                            <button type="button" id="agent-voice-btn" title="语音输入">🎤</button>
                            <button class="btn btn-primary" onclick="sendAgentMessage()">发送</button>
                            <button class="btn" style="background: #6c757d; color: #fff;" onclick="claimChat()" title="接手后 AI 不再自动回复该会话">接手</button>
                            <button class="btn" style="background: #17a2b8; color: #fff;" onclick="releaseToAi()" title="恢复 AI 自动回复">交还 AI</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 工单管理 -->
            <div id="tickets-section" style="display: none;">
                <div class="table-container">
                    <table id="tickets-table">
                        <thead>
                            <tr>
                                <th>工单号</th>
                                <th>用户</th>
                                <th>主题</th>
                                <th>状态</th>
                                <th>优先级</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tickets-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 工单回复弹窗 -->
    <div class="modal" id="ticket-reply-modal">
        <div class="modal-content">
            <h3>📝 回复工单</h3>
            <textarea id="ticket-reply-content" placeholder="输入回复内容..."></textarea>
            <div>
                <button class="btn btn-primary" onclick="submitTicketReply()">发送回复</button>
                <button class="btn" onclick="closeTicketReplyModal()">取消</button>
            </div>
        </div>
    </div>

    <script src="/static/js/device-id.js"></script>
    <script src="/static/js/auth-token.js"></script>
    <script src="/static/js/speech-input.js"></script>
    <script src="/static/js/account-display.js"></script>
    <script>
        let currentChatId = null;
        let currentTicketId = null;
        let currentViewMode = 'dashboard';
        let agentPollTimer = null;
        let chatMessageFingerprints = {};
        const AGENT_POLL_MS = 2500;
        
        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatChatTime(value) {
            if (!value) return '';
            const normalized = String(value).replace('T', ' ').slice(0, 19);
            return normalized;
        }

        function chatMessageFingerprint(messages) {
            if (!messages || !messages.length) return '0';
            const last = messages[messages.length - 1];
            return `${messages.length}:${last.created_at || ''}:${last.message || ''}`;
        }

        function startAgentPolling() {
            stopAgentPolling();
            agentPollTimer = setInterval(() => {
                if (document.hidden) return;
                refreshCurrentView();
            }, AGENT_POLL_MS);
        }

        function stopAgentPolling() {
            if (agentPollTimer) {
                clearInterval(agentPollTimer);
                agentPollTimer = null;
            }
        }

        async function refreshCurrentView() {
            if (currentViewMode === 'dashboard') {
                await loadStats();
                await loadWaitingChats();
            } else if (currentViewMode === 'chats') {
                await loadChatList();
                if (currentChatId) {
                    await loadChatMessages(currentChatId);
                }
            } else if (currentViewMode === 'tickets') {
                await loadTickets();
            }
        }

        function activateChatsView() {
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            document.querySelector('.sidebar-item:nth-child(2)').classList.add('active');
            setContentMode('chats');
            currentViewMode = 'chats';
        }
        
        function getToken() {
            if (typeof getAuthToken === 'function') return getAuthToken();
            return localStorage.getItem('access_token') || localStorage.getItem('token');
        }

        function ensureAuth() {
            const params = new URLSearchParams(window.location.search);
            const urlToken = params.get('token');
            if (urlToken) {
                setAuthToken(urlToken);
                params.delete('token');
                const clean = params.toString();
                const next = window.location.pathname + (clean ? `?${clean}` : '');
                window.history.replaceState({}, '', next);
            }
            if (!getToken()) {
                window.location.href = '/login?redirect=' + encodeURIComponent('/agent/console');
                return false;
            }
            return true;
        }

        async function apiFetch(url, options = {}) {
            const token = getToken();
            if (!token) {
                window.location.href = '/login?redirect=' + encodeURIComponent('/agent/console');
                return null;
            }
            const sep = url.includes('?') ? '&' : '?';
            const response = await fetch(`${url}${sep}token=${encodeURIComponent(token)}`, options);
            if (response.status === 401) {
                clearAuthToken();
                window.location.href = '/login?redirect=' + encodeURIComponent('/agent/console');
                return null;
            }
            return response;
        }

        function showConsoleError(message) {
            const area = document.getElementById('dashboard-section');
            if (!area) return;
            area.innerHTML = `<div style="padding:24px;color:#ff6b6b;background:#2d1f1f;border-radius:12px;margin:20px 0;">
                <strong>无法加载客服工作台</strong><p style="margin-top:10px;line-height:1.6;">${message}</p>
                <p style="margin-top:12px;font-size:0.875rem;color:#aaa;">请确认已用坐席账号登录，并重启后端服务以加载最新代码。</p>
            </div>`;
        }
        
        let currentRole = 'agent';
        let staffAgents = [];

        async function loadProfile() {
            let response = await apiFetch('/api/agent/me');
            if (response && response.ok) {
                const result = await response.json();
                if (result.success) {
                    currentRole = result.data.role;
                    localStorage.setItem('user_role', currentRole);
                    if (typeof initAccountDisplay === 'function') {
                        await initAccountDisplay();
                    }
                    return true;
                }
            }
            response = await apiFetch('/api/user');
            if (response && response.ok) {
                const me = await response.json();
                currentRole = me.role || 'user';
                localStorage.setItem('user_role', currentRole);
                if (currentRole !== 'admin' && currentRole !== 'agent') {
                    showConsoleError('当前账号不是人工坐席或管理员，无法使用客服工作台。');
                    return false;
                }
                if (typeof initAccountDisplay === 'function') {
                    await initAccountDisplay();
                }
                return true;
            }
            showConsoleError('登录状态无效，请重新登录。');
            return false;
        }

        async function loadStaffAgents() {
            if (currentRole !== 'admin') return;
            const response = await apiFetch('/api/agent/staff');
            if (!response) return;
            const result = await response.json();
            if (result.success) staffAgents = result.data || [];
        }

        async function assignChatTo(chatId) {
            if (currentRole !== 'admin' || !staffAgents.length) {
                alert('仅管理员可分配会话，请先在用户管理中添加坐席账号');
                return;
            }
            const names = staffAgents.map(a => a.username).join(', ');
            const agent = prompt('分配给坐席（用户名）:\n' + names);
            if (!agent) return;
            const response = await apiFetch('/api/agent/assign/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, agent_username: agent }),
            });
            if (!response) return;
            const result = await response.json();
            alert(result.message || (result.success ? '分配成功' : '分配失败'));
            loadChatList();
        }

        async function loadStats() {
            const response = await apiFetch('/api/agent/dashboard');
            if (!response) return;
            if (response.status === 403) {
                showConsoleError('接口拒绝访问（403）。请重启 uvicorn 服务后再试。');
                return;
            }
            const result = await response.json();
            
            if (result.success) {
                const stats = result.data;
                document.getElementById('stats-grid').innerHTML = `
                    <div class="stat-card">
                        <div class="number">${stats.active_chats}</div>
                        <div class="label">活跃对话</div>
                    </div>
                    <div class="stat-card">
                        <div class="number">${stats.waiting_chats}</div>
                        <div class="label">等待人工</div>
                    </div>
                    <div class="stat-card">
                        <div class="number">${stats.today_tickets}</div>
                        <div class="label">今日工单</div>
                    </div>
                    <div class="stat-card">
                        <div class="number">${stats.open_tickets}</div>
                        <div class="label">未处理工单</div>
                    </div>
                `;
            }
        }
        
        async function loadWaitingChats() {
            const response = await apiFetch('/api/agent/chats?status=pending_human');
            if (!response) return;
            const result = await response.json();
            
            if (result.success) {
                const chats = result.data;
                let html = '';
                if (chats.length === 0) {
                    html = '<tr><td colspan="4" style="text-align: center;">暂无等待处理的对话</td></tr>';
                } else {
                    chats.forEach(chat => {
                        html += `
                            <tr>
                                <td>${chat.chat_id}</td>
                                <td>${chat.username}</td>
                                <td>${chat.created_at}</td>
                                <td><span class="badge pending_human">等待人工</span></td>
                                <td><button class="btn btn-primary" onclick="openChatFromDashboard('${chat.chat_id}')">处理</button></td>
                            </tr>
                        `;
                    });
                }
                document.getElementById('waiting-chats-table').innerHTML = `
                    <table><tr><th>对话ID</th><th>用户</th><th>创建时间</th><th>状态</th><th>操作</th></tr>${html}</table>
                `;
            }
        }
        
        async function loadChatList() {
            const response = await apiFetch('/api/agent/chats');
            if (!response) return;
            const result = await response.json();
            
            if (result.success) {
                const chats = result.data;
                const listEl = document.getElementById('chat-list');
                const listScroll = listEl.scrollTop;
                let html = '';
                if (!chats.length) {
                    html = '<div style="padding:20px;color:#888;text-align:center;">暂无会话</div>';
                } else {
                    chats.forEach(chat => {
                        const statusClass = chat.status === 'active' ? 'badge active' : chat.status === 'pending_human' ? 'badge pending_human' : 'badge ended';
                        const statusText = chat.status === 'active' ? '活跃' : chat.status === 'pending_human' ? '等待人工' : '已结束';
                        const activeClass = chat.chat_id === currentChatId ? ' active' : '';
                        const preview = escapeHtml(chat.last_message || '暂无消息');
                        const timeLabel = formatChatTime(chat.last_message_at || chat.updated_at || chat.created_at);
                        html += `
                            <div class="chat-item${activeClass}" onclick="openChat('${chat.chat_id}')" id="chat-${chat.chat_id}">
                                <div class="username">客户 · ${escapeHtml(chat.username)}</div>
                                <div class="preview">${preview}</div>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
                                    <span class="time">${timeLabel}</span>
                                    <span class="${statusClass}">${statusText}</span>
                                </div>
                            </div>
                        `;
                    });
                }
                listEl.innerHTML = html;
                listEl.scrollTop = listScroll;
            }
        }

        async function openChatFromDashboard(chatId) {
            activateChatsView();
            await openChat(chatId);
        }
        
        async function openChat(chatId) {
            currentChatId = chatId;
            
            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
            document.getElementById(`chat-${chatId}`)?.classList.add('active');
            
            document.getElementById('chat-area').style.display = 'flex';
            
            await loadChatMessages(chatId, { forceScroll: true });
        }
        
        function isChatNearBottom(container, threshold = 80) {
            if (!container) return true;
            return container.scrollHeight - container.scrollTop - container.clientHeight <= threshold;
        }

        function scrollChatIfNeeded(container, stickToBottom) {
            if (!container || !stickToBottom) return;
            container.scrollTop = container.scrollHeight;
        }

        async function loadChatMessages(chatId, options = {}) {
            const forceScroll = !!options.forceScroll;
            const response = await apiFetch(`/api/agent/chat/${chatId}`);
            if (!response) return;
            const result = await response.json();
            
            if (result.success) {
                const chat = result.data;
                const fingerprint = chatMessageFingerprint(chat.messages);
                if (!forceScroll && chatMessageFingerprints[chatId] === fingerprint) {
                    return;
                }
                chatMessageFingerprints[chatId] = fingerprint;
                document.getElementById('chat-title').textContent = `客户 ${chat.username}`;
                
                let html = '';
                chat.messages.forEach(msg => {
                    let senderClass = 'user';
                    let senderName = msg.username;
                    const owner = chat.username || '';
                    const kind = msg.sender_kind || (
                        (msg.is_system || msg.username === 'system') ? 'system' :
                        (msg.username === 'ai_assistant') ? 'ai' :
                        (owner && msg.username === owner) ? 'customer' : 'staff'
                    );
                    
                    if (kind === 'system') {
                        senderClass = 'system';
                        senderName = '系统';
                    } else if (kind === 'ai') {
                        senderClass = 'agent';
                        senderName = '🤖 AI助手';
                    } else if (kind === 'staff') {
                        senderClass = 'agent';
                        const staffUser = msg.username || '客服';
                        senderName = staffUser === 'admin' ? '👤 人工客服' : `👤 客服 · ${staffUser}`;
                    } else if (kind === 'customer') {
                        senderClass = 'user';
                        senderName = `👤 客户 · ${msg.username || owner || '访客'}`;
                    }
                    
                    html += `
                        <div class="chat-message ${senderClass}">
                            <div class="sender">${senderName}</div>
                            <div class="bubble">${msg.message}</div>
                        </div>
                    `;
                });
                const box = document.getElementById('chat-messages');
                const stickToBottom = forceScroll || isChatNearBottom(box);
                box.innerHTML = html;
                scrollChatIfNeeded(box, stickToBottom);
            }
        }
        
        async function sendAgentMessage() {
            const message = document.getElementById('agent-input').value.trim();
            if (!message || !currentChatId) return;
            
            const response = await apiFetch('/api/agent/chat/reply', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: currentChatId, message })
            });
            
            if (response && response.ok) {
                document.getElementById('agent-input').value = '';
                await loadChatMessages(currentChatId, { forceScroll: true });
            }
        }
        
        async function parseAgentActionResponse(response) {
            const result = await response.json().catch(() => ({}));
            if (!response.ok) {
                const detail = result.detail;
                if (typeof detail === 'string') return { ok: false, message: detail };
                if (Array.isArray(detail) && detail[0]?.msg) {
                    return { ok: false, message: detail.map(d => d.msg).join('; ') };
                }
                return { ok: false, message: result.message || `请求失败 (${response.status})` };
            }
            return { ok: result.success !== false, message: result.message };
        }

        async function claimChat() {
            if (!currentChatId) {
                alert('请先在左侧选择一个会话');
                return;
            }
            const response = await apiFetch('/api/agent/chat/claim', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: currentChatId }),
            });
            if (!response) return;
            const parsed = await parseAgentActionResponse(response);
            alert(parsed.message || (parsed.ok ? '已接手，AI 将不再自动回复此会话' : '接手失败'));
            if (parsed.ok) {
                await loadChatMessages(currentChatId, { forceScroll: true });
                loadChatList();
            }
        }

        async function releaseToAi() {
            if (!currentChatId) {
                alert('请先在左侧选择一个会话');
                return;
            }
            const response = await apiFetch('/api/agent/chat/release-ai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: currentChatId }),
            });
            if (!response) return;
            const parsed = await parseAgentActionResponse(response);
            alert(parsed.message || (parsed.ok ? '已交还 AI 托管' : '操作失败'));
            if (parsed.ok) {
                await loadChatMessages(currentChatId, { forceScroll: true });
                loadChatList();
            }
        }
        
        async function loadTickets() {
            const response = await apiFetch('/api/agent/tickets');
            if (!response) return;
            const result = await response.json();
            
            if (result.success) {
                const tickets = result.data;
                let html = '';
                if (tickets.length === 0) {
                    html = '<tr><td colspan="6" style="text-align: center;">暂无工单</td></tr>';
                } else {
                    tickets.forEach(ticket => {
                        const statusText = ticket.status === 'open' ? '待处理' : ticket.status === 'processing' ? '处理中' : ticket.status === 'resolved' ? '已解决' : '已关闭';
                        const statusClass = ticket.status === 'open' ? 'badge active' : ticket.status === 'processing' ? 'badge pending_human' : ticket.status === 'resolved' ? 'badge active' : 'badge ended';
                        const priorityText = ticket.priority === 'low' ? '低' : ticket.priority === 'medium' ? '中' : ticket.priority === 'high' ? '高' : '紧急';
                        
                        html += `
                            <tr>
                                <td>${ticket.ticket_id}</td>
                                <td>${ticket.username}</td>
                                <td>${ticket.subject}</td>
                                <td><span class="${statusClass}">${statusText}</span></td>
                                <td>${priorityText}</td>
                                <td>
                                    ${ticket.chat_id ? `<button class="btn" onclick="openChatFromDashboard('${ticket.chat_id}')">会话</button>` : ''}
                                    <button class="btn btn-primary" onclick="openTicketReply('${ticket.ticket_id}')">回复</button>
                                    <button class="btn" onclick="updateTicketStatus('${ticket.ticket_id}', 'resolved')">完成</button>
                                </td>
                            </tr>
                        `;
                    });
                }
                document.getElementById('tickets-body').innerHTML = html;
            }
        }
        
        function openTicketReply(ticketId) {
            currentTicketId = ticketId;
            document.getElementById('ticket-reply-modal').classList.add('active');
        }
        
        function closeTicketReplyModal() {
            document.getElementById('ticket-reply-modal').classList.remove('active');
            document.getElementById('ticket-reply-content').value = '';
            currentTicketId = null;
        }
        
        async function submitTicketReply() {
            const message = document.getElementById('ticket-reply-content').value.trim();
            if (!message || !currentTicketId) return;
            
            const response = await apiFetch(`/api/agent/ticket/${currentTicketId}/reply`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message })
            });
            
            if (response && response.ok) {
                closeTicketReplyModal();
                await loadTickets();
                alert('回复成功');
            }
        }
        
        async function updateTicketStatus(ticketId, status) {
            const response = await apiFetch(`/api/agent/ticket/${ticketId}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ status })
            });
            
            if (response && response.ok) {
                await loadTickets();
            }
        }
        
        function setContentMode(mode) {
            const area = document.querySelector('.content-area');
            area.classList.toggle('chat-mode', mode === 'chats');
            document.getElementById('dashboard-section').style.display = mode === 'dashboard' ? 'block' : 'none';
            const chatsEl = document.getElementById('chats-section');
            chatsEl.classList.toggle('active-panel', mode === 'chats');
            document.getElementById('tickets-section').style.display = mode === 'tickets' ? 'block' : 'none';
            currentViewMode = mode;
        }

        function showDashboard() {
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            document.querySelector('.sidebar-item:nth-child(1)').classList.add('active');
            setContentMode('dashboard');
            loadStats();
            loadWaitingChats();
        }
        
        function showChats() {
            activateChatsView();
            loadChatList();
            if (currentChatId) {
                loadChatMessages(currentChatId);
            }
        }
        
        function showTickets() {
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            document.querySelector('.sidebar-item:nth-child(3)').classList.add('active');
            setContentMode('tickets');
            loadTickets();
        }
        
        function logout() {
            stopAgentPolling();
            if (typeof clearAuthToken === 'function') clearAuthToken();
            else {
                localStorage.removeItem('access_token');
                localStorage.removeItem('token');
                localStorage.removeItem('username');
            }
            window.location.href = '/login';
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            if (!ensureAuth()) return;
            const ok = await loadProfile();
            if (!ok) return;
            await loadStaffAgents();
            showDashboard();
            startAgentPolling();
            if (typeof initSpeechInput === 'function') {
                initSpeechInput({
                    inputId: 'agent-input',
                    buttonId: 'agent-voice-btn',
                    lang: 'zh-CN',
                    getToken,
                });
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                refreshCurrentView();
            }
        });
    </script>
</body>
</html>
